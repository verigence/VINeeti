##############################################################################
# deploy.yml — VINeeti to Cloudflare Workers + D1
#
# Deployment happens here, not by hand. Two builds of the same code:
#
#   test build      worker verigence-vineeti-hyundai, vineeti.jbrconsulting.in
#   Aditya Motors   worker verigence-vineeti, adityamotors.mh.jbrconsulting.in
#
# Release policy (docs/RELEASE_POLICY.md): a change is checked on the test build
# before it reaches Aditya Motors.
#   - Every push to `main` runs the checks and deploys to the test build only.
#   - Aditya Motors is updated only by starting this workflow by hand with
#     target "aditya-motors", for a commit that has already been deployed to the
#     test build and passed its post-deploy checks there, and with the box ticked
#     to say it was checked there. The run refuses anything else.
# It can also be started with a dry run that changes nothing.
#
# Secrets (Settings → Secrets and variables → Actions; organization secrets of
# the same names also work, as for the other Verigence deployments):
#   CLOUDFLARE_API_TOKEN   — CF API token with Workers Scripts: Edit + D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  — CF account ID (a1e15a39a0a8f86dc1ca9c6a8726e428)
#   SUPERADMIN_MOBILE      — the platform administrator's mobile number (their
#   SUPERADMIN_PASSWORD      sign-in ID) and password; the account is created on
#                            the first deployment and its password follows this
#                            secret, so changing the secret and deploying is how
#                            the password is changed. SUPERADMIN_NAME optional.
#   ANDROID_CERT_SHA256    — optional; the Android app's signing certificate
#                            fingerprint, printed by the Android build workflow
#   SMTP_USER              — optional; the product's own mail account and its app password (the
#   SMTP_PASSWORD            same pair the HR service uses), which writes to every dealership on this
#                            deployment, since VINeeti is sold as a service. Set them and the temporary
#                            passwords are emailed; leave them out and they are shown on
#                            screen. SMTP_HOST, SMTP_PORT and SMTP_FROM are optional too.
#
# The first run creates the D1 database "verigence-vineeti" and the application's
# own secrets (SESSION_SECRET, DATA_KEY, PLATFORM_ADMIN_TOKEN); later runs apply
# new migrations and deploy the new version. Everything goes through the
# project's Wrangler, so the token needs no permission beyond Wrangler's own.
# See scripts/deploy.mjs.
##############################################################################

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Which build to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - 'test'
          - 'aditya-motors'
      checked_on_test:
        description: 'For Aditya Motors: this commit has been checked on the test build (vineeti.jbrconsulting.in)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run only (say what would happen, change nothing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  actions: read # to look up whether a commit passed on the test build before it goes to Aditya Motors

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a running deploy — wait for it

env:
  # The account's workers.dev subdomain: the address the app is served on.
  WORKERS_SUBDOMAIN: jbrconsulting-it
  VINEETI_URL: https://verigence-vineeti.jbrconsulting-it.workers.dev

jobs:
  # Which builds this run deploys, under the release policy. A push goes to the test build only;
  # Aditya Motors only by hand, and only for a commit the test build has already passed.
  plan:
    name: Release policy
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
          CHECKED: ${{ github.event.inputs.checked_on_test }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test_build='{"target":"hyundai","label":"test build","url":"https://verigence-vineeti-hyundai.jbrconsulting-it.workers.dev","worker":"verigence-vineeti-hyundai","database":"verigence-vineeti-hyundai","bucket":"verigence-vineeti-hyundai-files","domains":"vineeti.jbrconsulting.in"}'
          aditya='{"target":"mahindra","label":"Aditya Motors","url":"https://verigence-vineeti.jbrconsulting-it.workers.dev"}'
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TARGET" = "aditya-motors" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              if [ "$CHECKED" != "true" ]; then
                echo "::error title=Not checked on the test build::Aditya Motors is updated only after the change has been checked on the test build. Tick the box to say it was."
                exit 1
              fi
              # The same commit must have been deployed to the test build by this workflow and passed
              # its post-deploy checks there.
              passed=""
              for run in $(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$SHA&per_page=50" --jq '.workflow_runs[].id'); do
                ok=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Post-deploy checks (hyundai)" and .conclusion == "success")] | length')
                if [ "$ok" -gt 0 ]; then passed="$run"; break; fi
              done
              if [ -z "$passed" ]; then
                echo "::error title=Not on the test build yet::Commit ${SHA:0:7} has not been deployed to the test build and passed its checks there. Deploy it to the test build first (merge to main, or run this workflow with target test), check it, then promote."
                exit 1
              fi
              echo "::notice title=Passed on the test build::Commit ${SHA:0:7} passed on the test build in run $passed."
            fi
            echo "deploy=[$aditya]" >> "$GITHUB_OUTPUT"
            echo "smoke=[$aditya]" >> "$GITHUB_OUTPUT"
            echo "Deploying ${SHA:0:7} to Aditya Motors" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=[$test_build]" >> "$GITHUB_OUTPUT"
            echo "smoke=[$test_build]" >> "$GITHUB_OUTPUT"
            echo "Deploying ${SHA:0:7} to the test build (vineeti.jbrconsulting.in). Aditya Motors is not changed: it is updated by promotion once this is checked." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy Worker (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [plan, check]
    timeout-minutes: 20
    # One build, deployed to two places. Each has its own Worker, database, bucket, secrets and
    # address, so neither can see the other's data; the code, the migrations and the schedule are the
    # same, from the same commit. Aditya Motors ("mahindra") is the original deployment: it sets none
    # of the overrides and is deployed from wrangler.jsonc exactly as before. Which of the two this
    # run deploys is the plan job's decision.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.deploy) }}
    env:
      VINEETI_URL: ${{ matrix.url }}
      DEPLOY_WORKER: ${{ matrix.worker }}
      DEPLOY_DATABASE: ${{ matrix.database }}
      DEPLOY_BUCKET: ${{ matrix.bucket }}
      DEPLOY_DOMAINS: ${{ matrix.domains }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # What the token can actually do, reported as an annotation on the run itself. An annotation is
      # readable from the run summary and from the API; a step log is not always reachable, and a
      # deployment that can only be diagnosed by someone with a browser open is a deployment nobody can
      # fix from anywhere else. This step reports and never judges: it stops the run only when a
      # credential is missing, and leaves "is this token allowed to do that" to Cloudflare, whose words
      # for it are more reliable than a guess at how Wrangler spells its scopes this year.
      - name: Check the Cloudflare credentials
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare credentials missing::CLOUDFLARE_API_TOKEN is not set. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare credentials missing::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          out=$(npx --no-install wrangler whoami 2>&1)
          code=$?
          echo "$out"
          {
            echo "### Cloudflare token"
            echo ''
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation carrying what Wrangler said, with the email address taken out and the
          # newlines encoded the way Actions wants them.
          note=$(printf '%s' "$out" | tr -d '\r' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/(email)/g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=wrangler whoami (exit ${code})::${note}"
          exit 0

      - name: Dry run (database, Worker and secrets, without changing anything)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy.mjs --dry-run

      # Database, web build, migrations, Worker with its secrets, health check.
      - name: Deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          # The mail account the temporary passwords go out from. Without these two nothing is emailed
          # and the password is shown on screen instead, which is how it worked before.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SUPERADMIN_MOBILE: ${{ secrets.SUPERADMIN_MOBILE }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          SUPERADMIN_NAME: ${{ secrets.SUPERADMIN_NAME }}
        run: node scripts/deploy.mjs

  smoke:
    name: Post-deploy checks (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [plan, deploy]
    # Checks the deployment that went out. A passing check on the test build is what lets the same
    # commit be promoted to Aditya Motors.
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event.inputs.dry_run != 'true' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    env:
      VINEETI_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No credentials: every check here is unauthenticated, or proves that a sign-in is required.
      - name: Live checks
        run: node scripts/post-deploy-check.mjs "$VINEETI_URL"
      - name: Say where it is
        run: echo "Deployed → $VINEETI_URL" >> "$GITHUB_STEP_SUMMARY"
