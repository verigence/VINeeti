# Builds the Android app (Trusted Web Activity around the deployed site) as a signed APK and an AAB for the Play Store.
# Run by hand from the Actions tab, giving the address the app opens.
#
# Signing. The first run with no keystore secret creates one and attaches it to the run as an artifact
# "android-keystore": download it, keep it safe, and add these repository secrets before the next build:
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64-encoded (base64 -w0 vineeti-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Every build prints the certificate's SHA-256 fingerprint: put it in the repository secret ANDROID_CERT_SHA256 and
# run "Deploy to Cloudflare" again, so the site publishes /.well-known/assetlinks.json and the app opens full screen.
# An app signed with a different key is a different app to Android and to the Play Store: the key is never replaced.

name: Build Android app

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Address the app opens, without https:// (e.g. verigence-vineeti.<subdomain>.workers.dev)"
        required: true
        type: string
      version_name:
        description: "Version shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Version code: a whole number, higher than the last build's"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          umask 077
          KS="$RUNNER_TEMP/vineeti-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "Using the keystore from the repository secrets."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            KEYSTORE_PASSWORD="$(openssl rand -base64 24)"; KEY_ALIAS="vineeti"; KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Verigence VINeeti, O=JBR Consulting, C=IN" >/dev/null
            echo "::add-mask::$KEYSTORE_PASSWORD"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEY_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore-secrets.txt"
            echo "No ANDROID_KEYSTORE_BASE64 secret: a new signing key was created. Download the android-keystore artifact and add the secrets before the next build."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          echo "Certificate SHA-256 fingerprint (for the repository secret ANDROID_CERT_SHA256): $FP"
          { echo "### Android build"; echo; echo "- Address: https://${{ inputs.host }}"; echo "- Version: ${{ inputs.version_name }} (${{ inputs.version_code }})"; echo "- Signing certificate SHA-256: \`$FP\`"; echo "- Put that fingerprint in the repository secret ANDROID_CERT_SHA256 and run \"Deploy to Cloudflare\" again."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease -PvineetiHost="${{ inputs.host }}" -PvineetiVersionName="${{ inputs.version_name }}" -PvineetiVersionCode="${{ inputs.version_code }}"

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/vineeti-${{ inputs.version_name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/vineeti-${{ inputs.version_name }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: vineeti-android-${{ inputs.version_name }}
          path: out/*
          if-no-files-found: error
      - name: Keep the new signing key
        if: steps.key.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            ${{ runner.temp }}/vineeti-release.jks
            ${{ runner.temp }}/keystore-secrets.txt
          retention-days: 7
