##############################################################################
# baseline.yml — mark a version of the code that went live
#
# Started by hand from the Actions tab. For the commit given it creates, all
# pointing at the same commit:
#   - an annotated tag            <name>
#   - a branch                    baseline/<name>
#   - a GitHub release            titled <title>, carrying the tag
# Nothing is deployed. To put a baseline back on a build, run "Deploy to
# Cloudflare" from the tag (see docs/RELEASE_POLICY.md).
##############################################################################

name: Baseline a release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Tag name: lowercase letters, digits and hyphens (e.g. aditya-mahindra-go-live-2026-11-02)'
        required: true
        type: string
      title:
        description: 'Title of the release (e.g. Aditya Mahindra Go-Live 02 Nov 2026)'
        required: true
        type: string
      commit:
        description: 'Commit to baseline (full SHA); empty means the commit this run starts from'
        required: false
        type: string

permissions:
  contents: write

jobs:
  baseline:
    name: Tag, branch and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag, the branch and the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
          TITLE: ${{ inputs.title }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$NAME" | grep -Eq '^[a-z0-9][a-z0-9-]{2,79}$'; then
            echo "::error title=Name not valid::Use lowercase letters, digits and hyphens only."
            exit 1
          fi
          sha=$(git rev-parse --verify "${COMMIT:-HEAD}^{commit}")
          if git ls-remote --exit-code origin "refs/tags/$NAME" >/dev/null; then
            echo "::error title=Tag exists::A tag called $NAME already exists. A baseline is never moved; choose another name."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NAME" "$sha" -m "$TITLE" -m "Baselined by ${{ github.actor }} on $(date -u +%Y-%m-%d) from commit $sha."
          git push origin "refs/tags/$NAME"
          git push origin "$sha:refs/heads/baseline/$NAME"
          gh release create "$NAME" --title "$TITLE" --notes "Baseline of commit $sha. Branch: baseline/$NAME." --verify-tag
          {
            echo "### $TITLE"
            echo ""
            echo "- Commit: \`$sha\`"
            echo "- Tag: \`$NAME\`"
            echo "- Branch: \`baseline/$NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
